name: Release

# A tag is a release: `git tag v0.1.0 && git push --tags` builds every target, runs the whole of
# CI, and hangs the four zips off the tag on GitHub. The build itself is NOT repeated here — the
# `build` job below calls .github/workflows/ci.yml, so there is exactly one definition of how the
# toolchain is installed and what "green" means. A release therefore cannot be cut from a commit
# whose tests, type check or lint did not pass.
#
# The CLI's Linux packages follow the same rule and are built there too, not here: ci.yml ships
# `ship-deb-rpm` (`.deb`, `.rpm`) and `ship-flatpak` (`.flatpak`) as uploaded artifacts, and the
# `release` job below only attaches them. `gjsify ship` needs a Fedora container with `gjs`, the
# gjsify CLI and — for the Flatpak — flatpak-builder plus org.gnome.Platform//50 and org.gnome.Sdk//50
# under `options: --privileged`; repeating that here would be the second copy of a toolchain this
# repository has decided to define once.
on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    # Only this job needs the token; the build above needs nothing but the checkout.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # The zips are the ones CI already packaged and uploaded as `extension-zips` — the artifact
      # a person has been downloading from a CI run by hand. Note they are NOT bit-reproducible
      # yet: fflate stamps the build time into every zip entry and scripts/build.ts collects the
      # entries in `readdir` order, so two builds of one tag differ. The release is built once and
      # is the artifact of record; rebuilding it would need `{ mtime: 0 }` plus a sorted collect.
      - name: Fetch the zips CI built
        uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: zips

      # The CLI's own Linux packages, again out of CI rather than built here (see the header).
      # TWO artifacts, not one: `.deb` + `.rpm` come out of the container that already runs the
      # bridge's tests, the `.flatpak` out of the privileged flatpak-builder job, and merging them
      # into a single upload would mean one of those jobs losing its packages whenever the other
      # half of the run did not happen.
      - name: Fetch the Linux packages CI built
        uses: actions/download-artifact@v4
        with:
          pattern: ship-*
          merge-multiple: true
          path: cli

      # Everything is attached by ONE `gh release create`, so a release either carries the zips and
      # the CLI packages or does not exist yet — a release that got the zips and silently lost the
      # `.deb` would be the shape of failure worth the two directory checks. They are checks on the
      # DIRECTORIES, not on a glob: a glob that matches nothing expands to itself, so
      # `gh release create … cli/*.deb` would upload a file literally named `cli/*.deb` and report
      # success.
      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ls -la zips cli
          [ -n "$(ls -A zips)" ] || { echo "::error::no extension zips were downloaded"; exit 1; }
          [ -n "$(ls -A cli)" ] || { echo "::error::no CLI packages were downloaded"; exit 1; }
          # `--generate-notes` is GitHub's own, from the previous tag: no note to keep in step here.
          gh release create "$TAG" zips/*.zip cli/* --title "$TAG" --generate-notes
          gh release view "$TAG" --json assets --jq '.assets[].name'

      # macOS and Windows are deliberately absent, and they need runners of their own rather than a
      # step here. `app/package.json#gjsify.ship` carries `dist/beifahrer.node.mjs` for both, and
      # `@gjsify/node-runtime-{darwin-arm64,darwin-x64,win32-x64}` are `optionalDependencies` that
      # `gjsify install` SKIPS on a Linux host — a plain install here would stage a package with no
      # interpreter in it, and `ship` exits 0 having said so loudly. Naming the target installs the
      # runtimes (`gjsify install --os darwin --cpu arm64 --immutable`, then `gjsify ship darwin
      # --arch arm64 --skip-build --target macos-app-zip`), which cross-builds the payload but
      # cannot RUN it: a Mach-O or PE binary is verified on its own OS or not at all, so a
      # `macos-latest` / `windows-latest` job is the honest place for this.

      # The signed Firefox build and `updates.json` (issue #3), signed from a person's machine and
      # dropped in as release assets. Deliberately NOT a CI step: it needs AMO's API key, which is a
      # credential with a quota and a review queue behind it, and a release that silently spends
      # someone's key is worse than one that waits for them.
      #
      #   sh extension/scripts/sign.sh v0.2.0
      #   gh release upload v0.2.0 extension/.output/signed/*.xpi extension/.output/signed/updates.json
      #
      # `updates.json` must keep its exact name — `browser_specific_settings.gecko.update_url` asks
      # for `releases/latest/download/updates.json`, and Firefox keeps that URL from the INSTALLED
      # version, so it cannot be moved later.

      # -----------------------------------------------------------------------------------------
      # STORE SUBMISSIONS GO HERE, and are deliberately absent: each one needs an account in a
      # store nobody can be created for from CI, plus a secret this repository does not hold and
      # this workflow must not need. A step per store, once a person has decided to submit:
      #
      #   Chrome Web Store  — $CHROME_WEB_STORE_CLIENT_ID, $CHROME_WEB_STORE_CLIENT_SECRET,
      #                       $CHROME_WEB_STORE_REFRESH_TOKEN  (Google Cloud OAuth client;
      #                       a Web Store API key alone cannot publish)
      #   Edge Add-ons      — $EDGE_ADDONS_PRODUCT_ID, $EDGE_ADDONS_CLIENT_ID,
      #                       $EDGE_ADDONS_CLIENT_SECRET, $EDGE_ADDONS_API_TOKEN  (Partner Center
      #                       product + Entra app; Edge's API is a Microsoft Graph extension of
      #                       the Store API)
      #   AMO               — $AMO_WEB_EXT_API_KEY, $AMO_WEB_EXT_API_SECRET  (the same pair
      #                       extension/scripts/sign.sh already reads from
      #                       ~/.config/beifahrer/amo.env; unlisted needs no review queue)
      #   Safari            — none of these help: a macOS Safari App Extension is signed by Xcode
      #                       against a provisioning profile and uploaded through App Store
      #                       Connect by a person. It stays a manual step, and `safari-mv3` ships
      #                       unsigned on purpose so a person can load it from Xcode.
      #
      # Until then the zips on the release ARE the distribution for a browser: unpack one into an
      # extension page, or point a person at the download. The Linux packages beside them are the
      # CLI — a bridge on their own needs an extension that talks to it, which is the native-messaging
      # host manifest no package registers yet (issue #44).
      # -----------------------------------------------------------------------------------------
