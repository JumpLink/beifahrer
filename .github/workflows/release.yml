name: Release

# A tag is a release: `git tag v0.1.0 && git push --tags` builds every target, runs the whole of
# CI, and hangs the four zips off the tag on GitHub. The build itself is NOT repeated here — the
# `build` job below calls .github/workflows/ci.yml, so there is exactly one definition of how the
# toolchain is installed and what "green" means. A release therefore cannot be cut from a commit
# whose tests, type check or lint did not pass.
#
# The installable packages follow the same rule and are built there too, not here: ci.yml ships
# the app as `ship-deb-rpm` (`.deb`, `.rpm`), `ship-windows` (`windows-dir-zip`, `.msi`),
# `ship-macos` (`.zip` + `.dmg` per arch, signed and notarised) and `ship-flatpak` (`.flatpak`), as
# uploaded artifacts, each file with its `.gjsify-release.json` record; the `release` job below only
# attaches them. ONE ship project (ADR 0023): the app is `kind: app`, one binary that opens the
# window without arguments and acts as the MCP/CLI bridge with a subcommand.
# Everything but macOS assembles on the SAME `fedora:44` container, and macOS is STAGED there too;
# only packing it needs a Mac, because `codesign`, `notarytool` and `hdiutil` exist nowhere else —
# ci.yml's `macos` job, which signs because this workflow passes `sign` and its secrets. Only the
# Flatpak needs flatpak-builder plus
# org.gnome.Platform//50 and org.gnome.Sdk//50 under `options: --privileged`, which is why it alone
# stays a separate job; repeating any of this here would be a second copy of a toolchain this
# repository has decided to define once.
on:
  push:
    tags: ['v*']
  # Re-cut assets for a tag that already exists, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build from (e.g. v0.2.0). Empty = the selected branch."
        required: false
        default: ""
        type: string
      publish:
        description: "Attach the artifacts to the GitHub release (needs a tag)"
        required: false
        default: false
        type: boolean

# Two tags pushed seconds apart would otherwise run twice against one release and
# upload in whichever order finished last. Queued rather than cancelled: a
# half-uploaded release is worse than a slow one.
concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # First, and cheap: a tag that is not the product version fails here, before a single package is
  # built. The artifact assert below would catch it too, but only after every target compiled.
  # A dispatch from a branch without a tag still gets the consistency check, just not the tag one.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the product version
        env:
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: node tools/version.mjs check ${TAG:+"$TAG"}

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    # A branch dispatch signs too when the secrets are there, so signing is rehearsed before a tag;
    # only a release REQUIRES them.
    with:
      sign: true
      release: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.tag != '') }}
    secrets: inherit

  release:
    needs: build
    # A dispatch without `publish` builds and stops: the name it would attach to
    # is a branch, not necessarily a release, so `inputs.publish` alone is not
    # enough on its own.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.tag != '') }}
    # Only this job needs the token; the build above needs nothing but the checkout.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # The zips are the ones CI already packaged and uploaded as `extension-zips` — the artifact
      # a person has been downloading from a CI run by hand. Note they are NOT bit-reproducible
      # yet: fflate stamps the build time into every zip entry and scripts/build.ts collects the
      # entries in `readdir` order, so two builds of one tag differ. The release is built once and
      # is the artifact of record; rebuilding it would need `{ mtime: 0 }` plus a sorted collect.
      - name: Fetch the zips CI built
        uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: zips

      # The installable packages, again out of CI rather than built here (see the header). SIX
      # artifacts, not one: `.deb` + `.rpm` and the Windows packages come out of
      # the container that already runs the tests, macOS out of the job that signs it, the
      # `.flatpak` out of the privileged flatpak-builder job, and merging them into a single upload would mean one of those jobs
      # losing its packages whenever the other half of the run did not happen. `merge-multiple`
      # flattens them into one directory; one package per OS, so no names collide.
      - name: Fetch the packages CI built
        uses: actions/download-artifact@v4
        with:
          pattern: ship-*
          merge-multiple: true
          path: packages

      # Everything is attached by ONE `gh release create`, so a release either carries the zips and
      # the packages or does not exist yet — a release that got the zips and silently lost the
      # `.deb` would be the shape of failure worth the two directory checks. They are checks on the
      # DIRECTORIES, not on a glob: a glob that matches nothing expands to itself, so
      # `gh release create … packages/*.deb` would upload a file literally named `packages/*.deb`
      # and report success.
      # Each file named individually, not just the two directory checks above: a zips/ or packages/
      # holding SOME files would pass those and still let `gh release create` publish an
      # incomplete release. Names and versions are the ones scripts/build.ts and
      # utils/ship/formats.ts actually render (ci.yml's own asserts), derived from the TAG rather
      # than the checkout below, and `v<version>` is the tag this workflow is triggered on.
      #
      # One package per OS (ADR 0023): window and CLI in the same files.
      - name: Assert every artifact arrived
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          ls -la zips packages
          version="${TAG#v}"
          missing=0
          for f in \
            "zips/beifahrer-${version}-chrome-mv3.zip" \
            "zips/beifahrer-${version}-edge-mv3.zip" \
            "zips/beifahrer-${version}-firefox-mv2.zip" \
            "zips/beifahrer-${version}-safari-mv3.zip" \
            "packages/beifahrer_${version}-1_all.deb" \
            "packages/beifahrer-${version}-1.noarch.rpm" \
            "packages/beifahrer-${version}-1.macos.arm64.zip" \
            "packages/beifahrer-${version}-1.macos.x86_64.zip" \
            "packages/beifahrer-${version}-1.arm64.dmg" \
            "packages/beifahrer-${version}-1.x86_64.dmg" \
            "packages/beifahrer-${version}-1.windows.x64.zip" \
            "packages/beifahrer-${version}-1.x64.msi" \
            "packages/eu.jumplink.beifahrer-${version}-1.x86_64.flatpak"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty artifact: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # The release body comes from the `<release>` entry in data/eu.jumplink.beifahrer.metainfo.xml,
      # the same list the Flatpak ships, so body and metainfo cannot drift. `release-notes` exits 1 when
      # the tag has no entry, so a release fails loudly instead of publishing an empty body: WRITE THE
      # ENTRY BEFORE `version.mjs set` and the tag (v0.1.16 was tagged without one and had to be skipped).
      # Into `src/`, not the workspace root: a plain checkout cleans the workspace and deleted the
      # `zips/` downloaded above (v0.1.17), and its `packages/` is the repo's own folder.
      - uses: actions/checkout@v4
        with:
          # The tag, not the branch a dispatch happened to select: the `releases` entry is read
          # from the ref being released.
          ref: ${{ inputs.tag || github.ref_name }}
          path: src

      - name: Set up Node 24 for the release notes
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate the release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          VERSION=$(node -p "require('./src/app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"
          cd src/app && gjsify release-notes "$TAG" --compare --metainfo ../data/eu.jumplink.beifahrer.metainfo.xml > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          ls -la zips packages
          [ -n "$(ls -A zips)" ] || { echo "::error::no extension zips were downloaded"; exit 1; }
          [ -n "$(ls -A packages)" ] || { echo "::error::no packages were downloaded"; exit 1; }
          # A dispatch re-cut of a tag that already has a release (v0.1.17) must not fail here, or
          # `sign-firefox` after it is skipped: upload over the old assets and refresh the notes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" zips/*.zip packages/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" zips/*.zip packages/* --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'

      # macOS is signed with a Developer ID and notarised, the `.dmg` stapled; ci.yml's `macos` job
      # checks each one against Gatekeeper before it is uploaded. Windows (x64, `windows-dir-zip` +
      # `.msi`) is still UNSIGNED, by design (ADR 0024 § A13 in gjsify) — a legitimate deliverable,
      # not a placeholder. Signing would attach as `--sign <certificate thumbprint or PFX path>`
      # reaching `signtool` (UNVERIFIED upstream: no run in gjsify has ever invoked it), on a runner
      # that holds the identity.

      # -----------------------------------------------------------------------------------------
      # STORE SUBMISSIONS GO HERE, and are deliberately absent: each one needs an account in a
      # store nobody can be created for from CI, plus a secret this repository does not hold and
      # this workflow must not need. A step per store, once a person has decided to submit:
      #
      #   Chrome Web Store  — $CHROME_WEB_STORE_CLIENT_ID, $CHROME_WEB_STORE_CLIENT_SECRET,
      #                       $CHROME_WEB_STORE_REFRESH_TOKEN  (Google Cloud OAuth client;
      #                       a Web Store API key alone cannot publish)
      #   Edge Add-ons      — $EDGE_ADDONS_PRODUCT_ID, $EDGE_ADDONS_CLIENT_ID,
      #                       $EDGE_ADDONS_CLIENT_SECRET, $EDGE_ADDONS_API_TOKEN  (Partner Center
      #                       product + Entra app; Edge's API is a Microsoft Graph extension of
      #                       the Store API)
      #   Safari            — none of these help: a macOS Safari App Extension is signed by Xcode
      #                       against a provisioning profile and uploaded through App Store
      #                       Connect by a person. It stays a manual step, and `safari-mv3` ships
      #                       unsigned on purpose so a person can load it from Xcode.
      #
      # Until then the zips on the release ARE the distribution for a browser: unpack one into an
      # extension page, or point a person at the download. The Linux packages beside them are the
      # CLI — a bridge on their own needs an extension that talks to it, which is the native-messaging
      # host manifest no package registers yet (issue #44).
      # -----------------------------------------------------------------------------------------

  # The signed Firefox build and `updates.json` (issue #3), as release assets. A job of its own,
  # AFTER `release`: the release already carries every other asset by then, so an AMO outage or a
  # rejected signing leaves this job red and the release intact. `updates.json` must keep its exact
  # name — `browser_specific_settings.gecko.update_url` asks for `releases/latest/download/updates.json`,
  # and Firefox keeps that URL from the INSTALLED version, so it cannot be moved later.
  #
  # Idempotent: AMO refuses to sign one version twice, so a rerun (or a `workflow_dispatch` re-cut)
  # first asks the release for a `.xpi` and stops there if it exists. The key pair is passed to the
  # signing step only.
  sign-firefox:
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.tag != '') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # sign.sh runs `gjsify run build`, which renders icons through GdkPixbuf/librsvg on GJS: the
    # same toolchain as ci.yml's build-and-test, hence the same image and prerequisites.
    container:
      image: fedora:44
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install system prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs libsoup3 gdk-pixbuf2 librsvg2 json-glib glib2-devel gh

      - name: Already signed?
        id: have
        run: |
          set -eu
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if echo "$names" | grep -q '\.xpi$'; then
            echo "::notice::$TAG already has a signed .xpi; AMO signs a version once, so nothing to do"
            echo "$names" | grep -qx 'updates.json' || echo "::warning::$TAG has an .xpi but no updates.json: attach it by hand (sh extension/scripts/sign.sh $TAG)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.have.outputs.skip == 'false'
        with:
          ref: ${{ env.TAG }}

      - name: Trust the checkout
        if: steps.have.outputs.skip == 'false'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node 24
        if: steps.have.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the toolchain (gjsify, web-ext)
        if: steps.have.outputs.skip == 'false'
        run: |
          set -eu
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"
          gjsify install --immutable

      - name: Sign on AMO and attach
        if: steps.have.outputs.skip == 'false'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_WEB_EXT_API_SECRET }}
        run: |
          set -eu
          sh extension/scripts/sign.sh "$TAG"
          # AMO names the file `<hash>-<version>.xpi`. The setup assistant links to
          # `releases/latest/download/beifahrer.xpi`, so a second copy carries that fixed name;
          # updates.json keeps pointing at the original.
          cp "$(ls -1t extension/.output/signed/*.xpi | head -1)" extension/.output/signed/beifahrer.xpi
          ls -la extension/.output/signed
          gh release upload "$TAG" extension/.output/signed/*.xpi extension/.output/signed/updates.json
          gh release view "$TAG" --json assets --jq '.assets[].name'
