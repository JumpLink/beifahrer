<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Beifahrer — store scene: the confirmation</title>
    <link rel="stylesheet" href="/tools/compose/frame.css" />
    <link rel="stylesheet" href="/tools/compose/store.css" />
  </head>
  <body>
    <!-- confirm.html opens as its own small popup window (extension/src/confirm.ts), so it stands in
         front of the browser with a title bar of its own, at the capture's natural size. -->
    <div class="stage">
      <div class="browser wide">
        <div data-chrome data-title="ticketTab" data-host="ticketsHost"></div>
        <div class="viewport">
          <main class="site">
            <h1>Ticket 3279</h1>
            <p class="meta"><span class="chip">Open</span><span>Opened Monday · 3 comments</span></p>
            <p class="body">
              The export button does nothing when the filter is empty. Steps to reproduce are in the first
              comment; the fix is merged and waiting for a release.
            </p>
            <div class="label">Comment</div>
            <div class="field"></div>
            <div class="send">Send</div>
          </main>
        </div>
      </div>
      <div class="win">
        <div class="titlebar">
          <span data-s="confirmTitle"></span><span class="wincontrols"><i></i><i></i><i></i></span>
        </div>
        <img data-shot="confirm" alt="" />
      </div>
    </div>
    <script src="/tools/compose/chrome.js"></script>
  </body>
</html>
