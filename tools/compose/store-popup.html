<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Beifahrer — store scene: the popup</title>
    <link rel="stylesheet" href="/tools/compose/frame.css" />
    <link rel="stylesheet" href="/tools/compose/store.css" />
  </head>
  <body>
    <!-- The popup capture, unretouched, hung under the pressed toolbar button over a synthetic page. -->
    <div class="stage">
      <div class="browser wide">
        <div data-chrome data-title="ticketTab" data-proto="http://" data-host="localHost" data-pressed></div>
        <div class="viewport">
          <main class="site">
            <h1>Ticket 3279</h1>
            <p class="meta"><span class="chip">Open</span><span>Opened Monday · 3 comments</span></p>
            <p class="body">
              The export button does nothing when the filter is empty. Steps to reproduce are in the first
              comment; the fix is merged and waiting for a release.
            </p>
            <div class="label">Comment</div>
            <div class="field"></div>
            <div class="send">Send</div>
          </main>
        </div>
        <div class="dropdown"><img data-shot="popup" alt="" /></div>
      </div>
    </div>
    <script src="/tools/compose/chrome.js"></script>
  </body>
</html>
