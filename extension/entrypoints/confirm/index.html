<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="confirm_window_title">beifahrer — allow this change?</title>
    <link rel="stylesheet" href="../../src/ui/style.css" />
  </head>
  <body class="adw-root confirm">
    <main id="ask" class="page">
      <h1 id="heading" class="title-2" data-i18n="confirm_heading_change"></h1>
      <adw-preferences-group id="where-group">
        <adw-action-row id="where" class="property" data-i18n-title="confirm_site"></adw-action-row>
      </adw-preferences-group>
      <p id="what" class="note"></p>
      <pre class="preview card monospace" id="text" hidden></pre>
      <ul class="preview card" id="items" hidden></ul>
      <adw-preferences-group>
        <adw-switch-row id="remember" data-i18n-title="confirm_remember_site"></adw-switch-row>
      </adw-preferences-group>
      <p class="note caption dimmed" data-i18n="confirm_timeout"></p>
      <div class="actions">
        <gtk-button id="deny" data-i18n-label="confirm_deny"></gtk-button>
        <gtk-button id="allow" suggested data-i18n-label="confirm_allow"></gtk-button>
      </div>
    </main>
    <adw-status-page
      id="gone"
      data-i18n-title="confirm_gone"
      data-i18n-description="confirm_gone_description"
      hidden
    ></adw-status-page>
    <script src="../../src/ui/kit.ts"></script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
