<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>beifahrer</title>
    <link rel="stylesheet" href="../../src/ui/style.css" />
    <style>
      body {
        width: 320px;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>beifahrer</h1>
      <button id="pause" class="switch" role="switch" aria-checked="true" title="Shortcut: Alt+Shift+B">
        …
      </button>
    </div>
    <p id="state">…</p>
    <p id="status" class="muted">…</p>
    <h2>This site</h2>
    <p id="site" class="mono">…</p>
    <div class="levels" role="group" aria-label="What the agent may do on this site">
      <button data-level="none" aria-pressed="false">Nothing</button>
      <button data-level="read" aria-pressed="false">Read</button>
      <button data-level="write" aria-pressed="false">Read + edit</button>
    </div>
    <label class="row" id="confirm-row" hidden>
      <input type="checkbox" id="confirm" /> Ask me before every change
    </label>
    <p id="hint" class="muted"></p>
    <details id="features-box">
      <summary>What the agent may use</summary>
      <div id="features"></div>
    </details>
    <h2>Agent sessions</h2>
    <p id="sessions-empty" class="muted">None connected.</p>
    <ul id="sessions" class="sessions"></ul>
    <h2>Activity</h2>
    <p id="activity-empty" class="muted">
      Nothing yet. What the agent does here is listed until the browser closes.
    </p>
    <ol id="activity" class="activity"></ol>
    <p><a href="#" id="options">Pairing and all sites…</a></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
