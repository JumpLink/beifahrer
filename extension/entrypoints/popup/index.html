<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extName">beifahrer</title>
    <link rel="stylesheet" href="../../src/ui/style.css" />
  </head>
  <body class="adw-root popup">
    <main class="page">
      <header class="page-head">
        <h1 class="title-4">beifahrer</h1>
        <span id="status" class="caption dimmed" role="status"></span>
      </header>

      <adw-banner id="problem" data-i18n-button-label="action_settings"></adw-banner>

      <adw-preferences-group>
        <adw-switch-row id="pause" data-i18n-title="pause_title"></adw-switch-row>
      </adw-preferences-group>

      <section class="site-level">
        <div class="group-head">
          <h2 class="heading" data-i18n="site_heading"></h2>
          <span id="site" class="caption dimmed"></span>
        </div>
        <adw-toggle-group id="levels" data-i18n-aria-label="level_group_label">
          <adw-toggle name="none" data-i18n-label="level_none"></adw-toggle>
          <adw-toggle name="read" data-i18n-label="level_read"></adw-toggle>
          <adw-toggle name="write" data-i18n-label="level_write"></adw-toggle>
        </adw-toggle-group>
        <p id="hint" class="note caption dimmed" role="status"></p>
        <adw-preferences-group id="confirm-group" hidden>
          <adw-switch-row id="confirm" data-i18n-title="confirm_writes"></adw-switch-row>
        </adw-preferences-group>
      </section>

      <adw-preferences-group>
        <adw-expander-row id="features" data-i18n-title="features_title"></adw-expander-row>
      </adw-preferences-group>

      <adw-preferences-group id="agents" data-i18n-title="agents_title"></adw-preferences-group>

      <adw-preferences-group id="activity" data-i18n-title="activity_title"></adw-preferences-group>

      <adw-preferences-group>
        <adw-action-row id="options" data-i18n-title="popup_options" activatable>
          <gtk-image slot="suffix" icon-name="go-next"></gtk-image>
        </adw-action-row>
      </adw-preferences-group>
    </main>
    <script src="../../src/ui/kit.ts"></script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
