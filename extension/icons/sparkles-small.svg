<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    The toolbar-size form (16 and 32 px) of icons/sparkles.svg: at those sizes the two small stars
    of the full icon shrink to a pixel or two and the thin main star turns into a grey smudge. So
    a fuller main star (its curves bend around a point off the centre) and ONE companion star.
    Same #sparkles id and gradient — scripts/icons.ts derives the variants from both the same way.
  -->
  <defs>
    <linearGradient id="colour" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="0.55" stop-color="#c061cb"/>
      <stop offset="1" stop-color="#f66151"/>
    </linearGradient>
  </defs>
  <path id="sparkles" fill="url(#colour)" d="M56 14Q68 56 110 68Q68 80 56 122Q44 80 2 68Q44 56 56 14Z M104 0Q109 17 126 22Q109 27 104 44Q99 27 82 22Q99 17 104 0Z"/>
</svg>
