      <stop
      offset="1"
      stop-color="#7fb0ec"
      id="stop2" />
      </linearGradient>
      <!-- the far edge of the roof turns away from the light, the near edge catches it -->
      <linearGradient
      id="roof-top"
      x1="0"
      y1="18"
      x2="0"
      y2="34"
      gradientUnits="userSpaceOnUse">
      <stop
      offset="0"
