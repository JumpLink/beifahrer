    <rect class="dim" x="34" y="70" width="40" height="6" rx="3"/>
    <rect class="dim" x="34" y="82" width="48" height="6" rx="3"/>
    <path class="spark" d="M104 79 C105 83.5 106.5 85 111 86 C106.5 87 105 88.5 104 93 C103 88.5 101.5 87 97 86 C101.5 85 103 83.5 104 79 Z"/>
  </g>

  <g id="node-beifahrer">
